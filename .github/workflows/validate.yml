name: Validate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_lint.txt

      - name: Run ruff
        run: ruff check custom_components/

      - name: Run codespell
        run: codespell --quiet-level=2 --ignore-words-list=hass,ba,fo --skip=custom_components/toon_smartmeter/translations/*

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python -c "import json; json.load(open('custom_components/toon_smartmeter/manifest.json'))"

      - name: Validate strings.json
        run: python -c "import json; json.load(open('custom_components/toon_smartmeter/strings.json'))"

      - name: Validate hacs.json
        run: python -c "import json; json.load(open('hacs.json'))"
